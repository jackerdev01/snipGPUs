name: Docker image

# Each release: wrap its Linux build into ghcr.io/<owner>/snipgpu:<version> + :latest
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download the Linux build of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [ -n "$TAG" ] || TAG="$(gh release view --json tagName -q .tagName)"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do          # the assets are uploaded just after the release is created
            gh release download "$TAG" -p snipgpu-linux --clobber && break
            sleep 20
          done
          test -s snipgpu-linux
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke-test (first run creates /data and asks for .env)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: snipgpu:test
      - run: |
          mkdir smoke
          set +e; docker run --rm -v "$PWD/smoke:/data" snipgpu:test; code=$?; set -e
          test "$code" = 2 && sudo test -f smoke/config_vast.yaml && sudo test -f smoke/ssh/id_ed25519.pub
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/snipgpu:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/snipgpu:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=snipgpu
            org.opencontainers.image.description=GPU rental bot for Vast.ai, Clore.ai, QuickPod and SaladCloud
            org.opencontainers.image.version=${{ env.VERSION }}
